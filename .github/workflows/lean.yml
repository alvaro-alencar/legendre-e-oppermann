name: Lean

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "fix/scientific-rigor"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize Lake project identifier
        run: |
          sed -i 's/kernel-esmeralda/KernelEsmeraldaProject/g' proof/lakefile.toml
          sed -i 's/kernel-esmeralda/KernelEsmeraldaProject/g' proof/lake-manifest.json
      - name: Install Lean/Lake and kernel-check proof
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proof
          test: false
          lint: false
          use-mathlib-cache: true
          nanoda: false
