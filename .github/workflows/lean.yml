name: Lean

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "fix/scientific-rigor"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean and Lake
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proof
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Resolve Mathlib dependencies
        working-directory: proof
        run: lake update
      - name: Download Mathlib cache
        working-directory: proof
        run: lake exe cache get
      - name: Kernel-check formalization
        working-directory: proof
        run: lake build
